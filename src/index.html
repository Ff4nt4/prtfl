<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Meta per il comportamento "fullscreen" su mobile: se il sito
         viene aggiunto alla schermata Home (iOS/Android) si apre senza
         barra del browser; viewport-fit=cover estende il contenuto
         sotto le aree "notch"/safe-area. Non sostituiscono la vera
         Fullscreen API (tentata via RotateDeviceGate.jsx quando il
         telefono e' in orizzontale), ma sono un aiuto complementare. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Claudia Mangone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Il codice usa font-family: "Inter" nelle didascalie, ma senza
         caricarlo il browser sostituiva con un font di sistema privo di
         un vero peso "medium" distinto (da qui l'effetto troppo thin). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
